name: Release

# Publishes a release when a version tag (v1.2.3) is pushed: the server
# package to npm with trusted publishing (no token; the package is linked to
# this repository and workflow on npmjs.com), then a GitHub release with the
# changelog entry. See RELEASING.md.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@11
      - run: npm ci
      - name: Check that the tag matches the versions and the changelog
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Publish the server package to npm, unless the version is there already
        run: |
          name=$(node -p "require('./server/package.json').name")
          if npm view "$name@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "$name@${GITHUB_REF_NAME#v} is on npm already (published by hand); skipping"
          else
            npm publish --workspace server
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
