name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check that the third-party notices match the build
        run: git diff --exit-code server/THIRD_PARTY_NOTICES.md
      - run: npm test
      - name: Validate the marketplace and the plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.330 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.330 plugin validate --strict plugins/cmmn-lens
          npx --yes @anthropic-ai/claude-code@2.1.330 plugin validate --profile directory plugins/cmmn-lens
